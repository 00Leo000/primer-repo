<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sumador de Puntos</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #EBF5FB; color: #154360; }
        h1 { font-size: 120px; color: #2874A6; margin: 0; }
        button { 
            padding: 14px 28px; font-size: 18px; margin: 8px; border: none; 
            border-radius: 12px; cursor: pointer; background: #85C1E9; color: white;
        }
    </style>
</head>
<body>
    <h1 id="marcador">0</h1>
    <p>puntos acumulados</p>
    <button onclick="sumarPunto()">+1 Punto</button>
    <button onclick="reiniciar()">Reiniciar</button>

    <script>
        let puntaje = 0; // [cite: 84]
        function sumarPunto() {
            puntaje = puntaje + 1; // [cite: 87]
            document.getElementById("marcador").innerHTML = puntaje; // [cite: 89]
            
            if (puntaje === 10) { // [cite: 90]
                document.getElementById("marcador").style.color = "#1ABC9C"; // Verde esmeralda [cite: 92]
                alert("¡Alcanzaste 10 puntos!"); // [cite: 93]
            }
        }
        function reiniciar() { // [cite: 94]
            puntaje = 0; // [cite: 96]
            const marcador = document.getElementById("marcador"); // [cite: 97]
            marcador.innerHTML = 0; // [cite: 98]
            marcador.style.color = "#2874A6"; // [cite: 101]
        }
    </script>
</body>
</html>
