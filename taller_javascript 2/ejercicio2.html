<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sumador de Puntos</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #EBF5FB; color: #154360; }
        h1 { font-size: 120px; color: #2874A6; margin: 0; }
        button { 
            padding: 14px 28px; font-size: 18px; margin: 8px; border: none; 
            border-radius: 12px; cursor: pointer; background: #85C1E9; color: white;
        }
    </style>
</head>
<body>
    <h1 id="marcador">0</h1>
    <p>puntos acumulados</p>
    <button onclick="sumarPunto()">+1 Punto</button>
    <button onclick="reiniciar()">Reiniciar</button>

    <script>
        let puntaje = 0;
        function sumarPunto() {
            puntaje = puntaje + 1;
            document.getElementById("marcador").innerHTML = puntaje;
            
            if (puntaje === 10) {
                document.getElementById("marcador").style.color = "#1ABC9C"; // Verde esmeralda
                alert("¡Alcanzaste 10 puntos!");
            }
        }
        function reiniciar() {
            puntaje = 0;
            const marcador = document.getElementById("marcador");
            marcador.innerHTML = 0;
            marcador.style.color = "#2874A6";
        }
    </script>
</body>
</html>
