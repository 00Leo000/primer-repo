<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Interruptor de Luz</title>
    <style>
        body { 
            font-family: sans-serif; text-align: center; padding: 60px; 
            transition: background 0.4s, color 0.4s; background: #EBF5FB; color: #154360; 
        }
        button { 
            padding: 14px 28px; font-size: 18px; margin-top: 20px; border: none; 
            border-radius: 12px; cursor: pointer; background: #5DADE2; color: white;
        }
    </style>
</head>
<body id="sala">
    <h2 id="estado-texto">Luz Encendida</h2>
    <div id="bombillo" style="font-size:100px">💡</div>
    <button id="btn-luz" onclick="toggleLuz()">Apagar</button>

    <script>
        let luzEncendida = true;
        function toggleLuz() {
            const sala = document.getElementById("sala");
            const texto = document.getElementById("estado-texto");
            const bombillo = document.getElementById("bombillo");
            const boton = document.getElementById("btn-luz");
            
            if (luzEncendida) {
                sala.style.backgroundColor = "#154360"; // Azul muy oscuro para apagado
                sala.style.color = "#EBF5FB";
                texto.innerHTML = "Luz Apagada";
                bombillo.innerHTML = "🌙";
                boton.innerHTML = "Encender";
                luzEncendida = false;
            } else {
                sala.style.backgroundColor = "#EBF5FB"; // Azul pastel brillante
                sala.style.color = "#154360";
                texto.innerHTML = "Luz Encendida";
                bombillo.innerHTML = "💡";
                boton.innerHTML = "Apagar";
                luzEncendida = true;
            }
        }
    </script>
</body>
</html>
