<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Canina</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #EBF5FB; color: #154360; }
        input { padding: 12px; font-size: 20px; width: 200px; border: 2px solid #AED6F1; border-radius: 10px; }
        button { 
            padding: 12px 24px; font-size: 18px; margin-left: 10px; background: #3498DB; 
            border-radius: 10px; color: white; border: none; cursor: pointer;
        }
        #resultado { font-size: 28px; margin-top: 24px; font-weight: bold; color: #2874A6; }
    </style>
</head>
<body>
    <h2>¿Cuántos años tienes en años perro?</h2>
    <input id="edad-humana" type="number" placeholder="Tu edad en años" min="1" max="100">
    <button onclick="calcularEdadCanina()">Calcular</button>
    <div id="resultado"></div>

    <script>
        const FACTOR_CANINO = 7;
        
        function calcularEdadCanina() {
            const valorTexto = document.getElementById("edad-humana").value;
            const edadHumana = Number(valorTexto);
            
            if (edadHumana <= 0 || valorTexto === "") {
                document.getElementById("resultado").innerHTML = "⚠️ Por favor escribe tu edad válida";
                return;
            }
            
            const edadCanina = edadHumana * FACTOR_CANINO;
            document.getElementById("resultado").innerHTML = "En años perro tienes: " + edadCanina + " años 🐶";
        }
    </script>
</body>
</html>
