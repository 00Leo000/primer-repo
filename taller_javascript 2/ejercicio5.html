<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Acceso</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #EBF5FB; color: #154360; }
        input { padding: 12px; font-size: 18px; width: 260px; border: 2px solid #AED6F1; border-radius: 10px; }
        button { 
            padding: 12px 24px; background: #5DADE2; border-radius: 10px; font-size: 18px; 
            margin-left: 8px; color: white; border: none; cursor: pointer; 
        }
        #mensaje-acceso { font-size: 26px; font-weight: bold; margin-top: 28px; padding: 20px; border-radius: 12px; }
    </style>
</head>
<body>
    <h2>Control de Acceso</h2>
    <input id="inp-nombre" type="text" placeholder="Escribe tu nombre">
    <button onclick="validarAcceso()">Verificar acceso</button>
    <div id="mensaje-acceso"></div>

    <script>
        const NOMBRE_PERMITIDO = "Admin";
        
        function validarAcceso() {
            const nombreEscrito = document.getElementById("inp-nombre").value;
            const mensajeDiv = document.getElementById("mensaje-acceso");
            
            if (nombreEscrito === NOMBRE_PERMITIDO) {
                mensajeDiv.innerHTML = "✅ Bienvenido, " + nombreEscrito + "!";
                mensajeDiv.style.background = "#D4EFDF"; // Verde pastel
                mensajeDiv.style.color = "#145A32";
                mensajeDiv.style.border = "2px solid #27AE60";
            } else {
                mensajeDiv.innerHTML = "❌ Acceso Denegado";
                mensajeDiv.style.background = "#FADBD8"; // Rojo pastel
                mensajeDiv.style.color = "#7B241C";
                mensajeDiv.style.border = "2px solid #E74C3C";
            }
        }
    </script>
</body>
</html>
