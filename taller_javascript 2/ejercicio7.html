<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Termómetro de Colores</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; transition: background 0.5s; background: #EBF5FB; color: #154360; }
        input { padding: 12px; font-size: 22px; width: 180px; text-align: center; border: 2px solid #AED6F1; border-radius: 10px; }
        button { padding: 12px 24px; background: #5DADE2; border-radius: 10px; font-size: 18px; margin-left: 8px; color: white; border: none; cursor: pointer; }
        #resultado-clima { font-size: 32px; font-weight: bold; margin-top: 28px; }
    </style>
</head>
<body>
    <h2>¿Cómo está el clima hoy?</h2>
    <input id="inp-temp" type="number" placeholder="Temperatura en °C">
    <button onclick="evaluarClima()">Evaluar clima</button>
    <div id="resultado-clima"></div>

    <script>
        function evaluarClima() {
            const temp = Number(document.getElementById("inp-temp").value);
            const resultado = document.getElementById("resultado-clima");
            
            if (temp > 35) {
                resultado.innerHTML = "🔥 Calor extremo: " + temp + "°C";
                resultado.style.color = "#E74C3C";
                document.body.style.background = "#FADBD8";
            } else if (temp > 25) {
                resultado.innerHTML = "☀️ Calor agradable: " + temp + "°C";
                resultado.style.color = "#E67E22";
                document.body.style.background = "#FDEBD0";
            } else if (temp > 15) {
                resultado.innerHTML = "⛅ Templado: " + temp + "°C";
                resultado.style.color = "#27AE60";
                document.body.style.background = "#D4EFDF";
            } else if (temp > 0) {
                resultado.innerHTML = "❄️ Frío: " + temp + "°C";
                resultado.style.color = "#2980B9";
                document.body.style.background = "#D6EAF8";
            } else {
                resultado.innerHTML = "🧊 Bajo cero: " + temp + "°C";
                resultado.style.color = "#8E44AD";
                document.body.style.background = "#EBDEF0";
            }
        }
    </script>
</body>
</html>
