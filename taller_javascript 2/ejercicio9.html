<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora con IVA y Descuento</title>
    <style>
        body { font-family: sans-serif; padding: 40px; max-width: 480px; margin: auto; background: #EBF5FB; color: #154360; }
        input { padding: 12px; font-size: 18px; width: 220px; border: 2px solid #AED6F1; border-radius: 10px; }
        button { padding: 12px 24px; font-size: 18px; margin-top: 15px; background: #2874A6; color: white; border: none; border-radius: 10px; cursor: pointer; display: block; width: 100%; } 
        .btn-descuento { background: #117A65; } /* Color diferente para el nuevo botón */
        .linea { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #AED6F1; font-size: 18px; } 
        .total { font-weight: bold; font-size: 22px; color: #2874A6; border-bottom: none; }
        .ahorro { color: #117A65; font-weight: bold; } /* Estilo para el texto de ahorro */
    </style>
</head>
<body>
    <h2 style="text-align: center;">Calculadora de Precios</h2>
    <label>Precio base ($):</label><br>
    <input id="inp-precio" type="number" placeholder="Ej: 50000" min="0">
    
    <button onclick="calcularConIVA()">Calcular con IVA 10%</button>
    <!-- Agregamos el nuevo botón -->
    <button class="btn-descuento" onclick="calcularConDescuento()">Calcular con descuento del 10%</button>

    <div id="desglose" style="margin-top: 20px; background: white; border-radius: 10px; padding: 10px;"></div>

    <script>
        const TASA_IVA = 0.10;
        const TASA_DESCUENTO = 0.10; // Definimos el descuento del 10%

        function calcularConIVA() {
            const precioBase = Number(document.getElementById("inp-precio").value);
            
            if (precioBase <= 0) {
                alert("Por favor ingresa un precio mayor a 0"); 
                return;
            }
            
            const valorIVA = precioBase * TASA_IVA;
            const precioTotal = precioBase + valorIVA;
            
            const baseFormateada = precioBase.toFixed(2);
            const ivaFormateado = valorIVA.toFixed(2);
            const totalFormateado = precioTotal.toFixed(2);
            
            document.getElementById("desglose").innerHTML = 
                '<div class="linea"><span>Precio base:</span><span>$' + baseFormateada + '</span></div>' +
                '<div class="linea"><span>IVA (10%):</span><span>$' + ivaFormateado + '</span></div>' +
                '<div class="linea total"><span>TOTAL:</span><span>$' + totalFormateado + '</span></div>';
        }

        // Nueva función para el mini-reto
        function calcularConDescuento() {
            const precioBase = Number(document.getElementById("inp-precio").value);
            
            if (precioBase <= 0) {
                alert("Por favor ingresa un precio mayor a 0"); 
                return;
            }
            
            // 1. Calculamos el descuento
            const valorDescuento = precioBase * TASA_DESCUENTO;
            
            // 2. Calculamos el precio CON descuento ANTES del IVA
            const precioConDescuento = precioBase - valorDescuento;
            
            // 3. Aplicamos el IVA sobre el nuevo precio descontado
            const valorIVA = precioConDescuento * TASA_IVA;
            const precioTotal = precioConDescuento + valorIVA;
            
            // Formateamos los valores
            const baseFormateada = precioBase.toFixed(2);
            const descuentoFormateado = valorDescuento.toFixed(2);
            const precioDescontadoFormateado = precioConDescuento.toFixed(2);
            const ivaFormateado = valorIVA.toFixed(2);
            const totalFormateado = precioTotal.toFixed(2);
            
            // Mostramos el resultado
            document.getElementById("desglose").innerHTML = 
                '<div class="linea"><span>Precio original:</span><span>$' + baseFormateada + '</span></div>' +
                '<div class="linea ahorro"><span>Descuento (10%):</span><span>-$' + descuentoFormateado + '</span></div>' +
                '<div class="linea"><span>Subtotal:</span><span>$' + precioDescontadoFormateado + '</span></div>' +
                '<div class="linea"><span>IVA (10%):</span><span>$' + ivaFormateado + '</span></div>' +
                '<div class="linea total"><span>TOTAL:</span><span>$' + totalFormateado + '</span></div>' +
                '<div class="linea" style="text-align: center; border-top: 2px dashed #AED6F1; margin-top: 10px;">' +
                '<span class="ahorro">¡Te has ahorrado $' + descuentoFormateado + '!</span></div>';
        }
    </script>
</body>
</html>
